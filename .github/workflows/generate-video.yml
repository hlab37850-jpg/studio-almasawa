name: Generate AI Video (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "English visual prompt for the generated scene"
        required: true
        type: string
        default: "A cinematic vertical video about an Arabic creative studio using artificial intelligence: elegant modern workspace, a developer creating digital visuals, realistic camera movement, premium lighting, no text, no letters, no watermark, no logos."
      aspect_ratio:
        description: "Output aspect ratio"
        required: true
        type: choice
        options:
          - "9:16"
          - "16:9"
        default: "9:16"

permissions:
  contents: read

concurrency:
  group: kaggle-ai-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/arabic-video-pipeline

      - name: Validate Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Add KAGGLE_USERNAME and KAGGLE_API_TOKEN in Repository Settings > Secrets and variables > Actions. Do not commit credentials."
            exit 1
          fi

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare private GPU notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
        run: |
          python scripts/prepare_kaggle_kernel.py \
            --username "$KAGGLE_USERNAME" \
            --prompt "$VIDEO_PROMPT" \
            --aspect-ratio "$ASPECT_RATIO"

      - name: Submit generation to Kaggle GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle/wan-run --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle generation
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL_ID="$KAGGLE_USERNAME/studio-almasawa-wan-run"
          mkdir -p output
          completed=0
          for attempt in $(seq 1 80); do
            status="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            echo "Kaggle status check $attempt: $status"
            if echo "$status" | grep -Eqi 'COMPLETE'; then
              completed=1
              break
            fi
            if echo "$status" | grep -Eqi 'ERROR|CANCEL'; then
              echo "::error::Kaggle notebook ended unsuccessfully: $status"
              exit 1
            fi
            sleep 30
          done
          if [ "$completed" -ne 1 ]; then
            echo "::error::Timed out waiting for Kaggle. Check the private notebook in your Kaggle account."
            exit 1
          fi
          kaggle kernels output "$KERNEL_ID" -p output --force
          test -s output/final.mp4
          test -s output/generation-report.json

      - name: Verify MP4 with ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json output/final.mp4 | tee output/ffprobe.json
          python - <<'PY'
          import json
          p=json.load(open("output/ffprobe.json", encoding="utf-8"))
          assert p.get("streams"), "No media stream found"
          assert any(s.get("codec_name") == "h264" for s in p["streams"]), "H.264 video stream not found"
          assert float(p["format"]["duration"]) > 1, "Video duration is too short"
          print("Verified: MP4 exists, contains H.264 video, and has a valid duration.")
          PY

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: studio-almasawa-ai-video
          path: |
            output/final.mp4
            output/generation-report.json
            output/ffprobe.json
          if-no-files-found: error
          retention-days: 3
